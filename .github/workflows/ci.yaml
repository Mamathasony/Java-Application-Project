
name: CloudShield CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      # 1. Maven lifecycle stages
      - name: Maven Validate
        run: mvn -B validate

      - name: Maven Compile
        run: mvn -B compile

      - name: Maven Test
        run: mvn -B test

      - name: Maven Package
        run: mvn -B package

      # 2. SonarCloud analysis
      - name: SonarCloud Analysis
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=mamathasony
          -Dsonar.projectKey=Mamathasony_Java-Application-Project

      # 3. Build Docker image
      - name: Build Docker image
        run: docker build -t cloudshield-app:${{ github.sha }} .

      # 4. Install Trivy
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: v0.69.3

      # 5. Push to ECR only on main branch push/manual run
      - name: Configure AWS credentials
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        if: github.event_name != 'pull_request'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag Docker image for ECR
        if: github.event_name != 'pull_request'
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: cloudshield-app
          IMAGE_TAG: ${{ github.sha }}
        run: docker tag cloudshield-app:${{ github.sha }} $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: Push Docker image to ECR
        if: github.event_name != 'pull_request'
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: cloudshield-app
          IMAGE_TAG: ${{ github.sha }}
        run: docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      # 6. Scan the image with Trivy after ECR push
      - name: Trivy image vulnerability scan
        if: github.event_name != 'pull_request'
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            "$REGISTRY/cloudshield-app:$IMAGE_TAG"
